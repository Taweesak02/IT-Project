services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: webproject
      POSTGRES_USER: webproject
      POSTGRES_PASSWORD: webproject
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webproject -d webproject"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://webproject:webproject@db:5432/webproject?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      JWT_REFRESH_TOKEN_EXPIRES_IN_MINUTES: ${JWT_REFRESH_TOKEN_EXPIRES_IN_MINUTES:-10080}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-this-password}
    ports:
      - "3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
    command: ["sh", "-c", "npm run prisma:deploy && npx prisma db seed && npm run start"]

volumes:
  postgres-data: